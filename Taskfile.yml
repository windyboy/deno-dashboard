version: '3'

vars:
  BINARY_NAME: telegram
  BUILD_DIR: bin
  TMP_DIR: tmp
  CSS_SOURCE: ./front/src/index.css
  CSS_TARGET: ./front/public/styles.css
  TEMPL_DIR: ./front

tasks:
  default:
    cmds:
      - task: back:build
      - task: front:build
    desc: Default task to build both back-end and front-end projects

  # Back-end tasks
  back:build:
    cmds:
      - echo "Building Go binary..."
      - cd back && go build -o {{.BUILD_DIR}}/{{.BINARY_NAME}} .
      - echo "Build complete."
    desc: Build the Go binary for the back-end

  back:clean:
    cmds:
      - echo "Cleaning up..."
      - rm -rf back/{{.BUILD_DIR}} back/{{.TMP_DIR}}
      - echo "Cleanup complete."
    desc: Clean up build and temporary directories for the back-end

  back:deps:
    cmds:
      - echo "Installing back-end dependencies..."
      - cd back && go get -u -d -v ./...
      - cd back && go mod tidy
      - echo "Back-end dependencies installed."
    desc: Install back-end dependencies

  back:dev:
    desc: "Run the back-end development server"
    cmds:
      - cd back && go run main.go

  back:test:
    desc: "Run back-end tests"
    cmds:
      - cd back && go test ./...

  # Front-end tasks
  front:deps:
    desc: "Install front-end dependencies using Bun"
    cmds:
      - echo "Installing front-end dependencies with Bun..."
      - cd front && bun install
      - echo "Front-end dependencies installed."

  front:dev:
    desc: "Run the front-end development server"
    cmds:
      - cd front && deno task dev

  front:build:
    desc: "Build the front-end project for production"
    cmds:
      - cd front && deno task build

  front:test:
    desc: "Run front-end tests"
    cmds:
      - cd front && deno task test

  default:
    desc: "Show available tasks"
    cmds:
      - task --list